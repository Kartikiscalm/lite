services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kb
      GOAL_READER_PASSWORD: ${GOAL_READER_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d kb"]
      interval: 3s
      retries: 30
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/litellm
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_MASTER_KEY}
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
  app:
    build: ./app
    volumes:
      - ./db/data:/data:ro
    depends_on:
      db: {condition: service_healthy}
      litellm: {condition: service_started}
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      GOAL_READER_PASSWORD: ${GOAL_READER_PASSWORD}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "8000:8000"
